Logging:
    default: INFO

General:
    Modus:         List
    Time_Step_Mode: None
    Delta_Time:    1.0
    End_Time:      2000.0
    Randomseed:    -1
    Nevents:       10
#    Minimum_Nonempty_Ensembles:
#         Number: 1000
#         Maximum_Ensembles_Run: 1100

Collision_Term:
    Force_Decays_At_End: false
#    No_Collisions: true

Output:
    Output_Interval: 10.0
    Particles:
        Format:          ["Oscar2013"]

Modi:
    List:
        # If the build directory is not located in the smash directory anymore,
        # the absolute path specified below will not work anymore.
        # You can alternatively pass the path directly from the command line
        # with the "-c" command:
        # ./smash -i <path to config file> -c 'Modi: { List: { File_Directory: <path to file that is read in> } }
        File_Directory: "results"
        File_Prefix: "oscar_list.dat"
        Shift_Id: 0
