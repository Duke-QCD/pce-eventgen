# Campaign configuration for one NERSC profile, generated by nersc/configure_user.py.
# Every key is described in docs/reference/configuration.md. Command-line options
# override these values. ${VAR} references are expanded from the environment that
# activate.sh sets up.

[files]
params = {{CODE_HOME}}/config/initialization/base_parameters.dat
design = {{DESIGN}}
launcher = {{LAUNCHER}}
music_input_template = {{CODE_HOME}}/config/initialization/music_input_template

[run]
directory = {{RAW_ROOT}}
system = AuAu200
prefix = design
# Zero-based, inclusive design-table rows. Start with one design.
row_start = 0
row_end = 0
# Fixed for the life of the campaign: it bounds event IDs and directory names.
nevents = {{NEVENTS}}
jobs_per_design = 1
initialize = true
# Refuse to touch an existing design directory unless --allow-existing is given.
refuse_existing = true

[submit]
mode = auto
restore_archives = true
max_afterburner_retries = 3
qos = {{QOS}}
time = {{SUBMIT_TIME}}
nodes = 1
ntasks_per_node = {{SUBMIT_TASKS}}
cpus_per_task = {{SUBMIT_CPUS}}
slurm_log_root = {{RAW_ROOT}}/_logs/slurm
event_log_root = {{RAW_ROOT}}/_logs/events

[repair]
apply_repairs = true
repair_log_root = {{RECORDS}}/repair_logs
finalize_archive_failed = true
archive_root = {{ARCHIVE_ROOT}}
# Original source base for archive paths; independent of the current user's scratch.
archive_base = {{ARCHIVE_BASE}}

[pipeline]
record_dir = {{RECORDS}}
survey_json = {{RECORDS}}/survey.json
cache_manifest = {{RECORDS}}/cache.manifest
reap_manifest = {{RECORDS}}/reap_ready.manifest
cache_cfs_root = {{CACHE_PUBLISHED_ROOT}}/{{CAMPAIGN}}
# Staging on CFS survives scratch purges and preserves reusable quarantined builds.
cache_local_root = {{CACHE_STAGING_ROOT}}/{{CAMPAIGN}}
expected_fingerprint = {{CODE_HOME}}/config/cache_fingerprint_AuAu200_gap015.json
pdg_mass = ${HIC_PDG_MASS}
baryon_dict = ${HIC_BARYON_DICT}
# Scratch space for decompressing cache shards during verification.
tmp_dir = {{RAW_ROOT}}/_tmp
slurm_log_root = {{RAW_ROOT}}/_logs/slurm
analysis_out_dir = {{OUTPUT_ROOT}}/analysis/{{CAMPAIGN}}

[cache]
nprocs = 16
validate_events = 50
events_per_shard = 50
max_dropped_events = 50
allow_malformed_rows = 1000
designs_per_task = 4
throttle = 4
cores = 128
nodes_per_task = 1
account = {{ACCOUNT}}
constraint = cpu
qos = {{QOS}}
time = {{CACHE_TIME}}
# Local (interactive cache or reap) concurrency; tune to the allocation/CFS load.
jobs = 4

[analysis_campaign]
# Observable definitions; see docs/analysis.md for the OO5360 v3 selection.
analysis_profile = baseline
jobs = 8
estimator = cent_ch_eta10
bin_edges = 0 5 10 20 30 40 50 60 70 80
y_window = 0.5
charged_window = eta05
n_boot = 0
et_eta_window = 0.5
harmonics = 2 3

# Inventory-derived multiplicities (docs/reference/analysis-inputs.md). Shares
# [analysis_campaign] estimator/bin_edges/jobs; never enters model_matrix.
[feeddown]
pids = 3212 3122 2212 3222
combine_antiparticles = true
